<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        var isAdmin = window.location.pathname.indexOf('/admin') === 0;
        var manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = isAdmin ? '/manifest-admin.json' : '/manifest.json';
        document.head.appendChild(manifest);
        var title = document.createElement('meta');
        title.name = 'apple-mobile-web-app-title';
        title.content = isAdmin ? 'LS Admin' : 'Ludi Sonores';
        document.head.appendChild(title);
      })();
    </script>
    <meta
      name="description"
      content="Orchestra Ludi Sonores — sito ufficiale: concerti, masterclass e bandi."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Ludi Sonores Orchestra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
